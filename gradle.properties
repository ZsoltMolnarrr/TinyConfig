# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 3.1.1
maven_group = net.tiny_config
archives_name = tiny_config
enabled_platforms = fabric,neoforge

# Minecraft properties
# 26.1 is the first unobfuscated Minecraft version: no Yarn, no mappings, no remapping.
minecraft_version = 26.1.2
# Additional Minecraft versions this build is published for, on top of minecraft_version.
# The mod has no version-specific Minecraft code, so one binary supports every 26.x release.
additional_game_versions = 26.1,26.1.1,26.2

# Dependencies
fabric_loader_version = 0.19.3
neoforge_version = 26.1.2.76

# Architectury Loom (no-remap) is in beta for 26.1
loom.ignoreDependencyLoomVersionValidation=true
