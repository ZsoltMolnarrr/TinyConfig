# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 3.1.1
maven_group = net.tiny_config
archives_name = tiny_config
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.11
yarn_mappings = 1.21.11+build.3
# Additional Minecraft versions this build is published for, on top of minecraft_version.
# The mod has no version-specific Minecraft code, so one binary supports every 1.21.x patch.
additional_game_versions = 1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10

# Dependencies
fabric_loader_version = 0.18.2
neoforge_version = 21.11.3-beta
yarn_mappings_patch_neoforge_version = 1.21+build.6
